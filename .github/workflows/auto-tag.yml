name: Auto-tag on push to main

# Bumps the version tag automatically every time a commit lands on `main`.
# Default bump is `patch` (v1.0.0 -> v1.0.1). Influence the bump by including
# one of these tokens in the commit message:
#
#   #major  -> v1.0.1 -> v2.0.0
#   #minor  -> v1.0.1 -> v1.1.0
#   #patch  -> v1.0.1 -> v1.0.2  (default)
#   #none   -> skip tagging this commit
#
# Packagist auto-publishes the new tag once you've configured the GitHub
# webhook (Settings -> Integrations & services -> Packagist) on the package
# repository.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '#none')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          INITIAL_VERSION: 1.0.0
          # Bump rules: a commit message containing #major / #minor / #patch
          # overrides DEFAULT_BUMP. #none is honored by the `if:` guard above.

      - name: Create GitHub release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
